name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: JVM tests + Android compile
        run: ./gradlew :shared:jvmTest :shared:compileKotlinJvm :androidApp:compileDebugKotlin --stacktrace

      - name: Run detekt (if configured)
        run: ./gradlew detekt || echo "detekt not configured – skipping"

      - name: Run ktlint
        run: ./gradlew ktlintCheck || echo "ktlint not configured – skipping"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
